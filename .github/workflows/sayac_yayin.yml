name: "24/7 Live 2027 Countdown"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          cat << 'EOF' > run_stream.sh
          #!/bin/bash
          TARGET=$(date -d "2027-01-01 00:00:00" +%s)

          while true; do
            NOW=$(date +%s)
            DIFF=$((TARGET - NOW))

            if [ $DIFF -le 0 ]; then
              TIME_STR="MUTLU YILLAR!"
            else
              DAYS=$((DIFF / 86400))
              HOURS=$(( (DIFF % 86400) / 3600 ))
              MINS=$(( (DIFF % 3600) / 60 ))
              SECS=$(( DIFF % 60 ))
              TIME_STR="${DAYS} Gun ${HOURS} Saat ${MINS} Dk ${SECS} Sn"
            fi

            ffmpeg -y -re \
              -f lavfi -i color=c=0x0d1117:s=1920x1080:r=1 \
              -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
              -vf "drawtext=text='2027 YENI YIL SAYACI':fontcolor=0x58a6ff:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2-80,drawtext=text='${TIME_STR}':fontcolor=white:fontsize=75:x=(w-text_w)/2:y=(h-text_h)/2+40" \
              -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -g 2 \
              -c:a aac -b:a 128k -t 1 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"
          done
          EOF

          chmod +x run_stream.sh
          ./run_stream.sh
'








