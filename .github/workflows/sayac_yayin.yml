name: "24/7 Live 2027 Countdown"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip
          pip3 install pillow

      - name: Start Canvas Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          cat << 'EOF' > generate_stream.py
          import time
          import subprocess
          from datetime import datetime
          from PIL import Image, ImageDraw, ImageFont

          target_date = datetime(2027, 1, 1, 0, 0, 0)

          # Ffmpeg yayını başlat
          command = [
              'ffmpeg',
              '-y',
              '-f', 'rawvideo',
              '-vcodec', 'rawvideo',
              '-s', '1920x1080',
              '-pix_fmt', 'rgb24',
              '-r', '1',
              '-i', '-',
              '-f', 'lavfi',
              '-i', 'anullsrc=channel_layout=stereo:sample_rate=44100',
              '-c:v', 'libx264',
              '-preset', 'ultrafast',
              '-tune', 'zerolatency',
              '-b:v', '2500k',
              '-g', '2',
              '-c:a', 'aac',
              '-b:a', '128k',
              '-f', 'flv',
              f"rtmp://a.rtmp.youtube.com/live2/{import_stream_key}"
          ]

          import os
          stream_key = os.environ.get("STREAM_KEY")
          command[-1] = f"rtmp://a.rtmp.youtube.com/live2/{stream_key}"

          proc = subprocess.Popen(command, stdin=subprocess.PIPE)

          try:
              font_large = ImageFont.load_default()
          except Exception:
              font_large = None

          while True:
              now = datetime.now()
              diff = target_date - now

              if diff.total_seconds() <= 0:
                  text_timer = "MUTLU YILLAR!"
              else:
                  days = diff.days
                  hours, remainder = divmod(diff.seconds, 3600)
                  minutes, seconds = divmod(remainder, 60)
                  text_timer = f"{days} Gün {hours} Saat {minutes} Dk {seconds} Sn"

              img = Image.new('RGB', (1920, 1080), color=(13, 17, 23))
              draw = ImageDraw.Draw(img)

              # Başlık ve Sayaç Yazıları
              draw.text((960, 400), "2027 YENİ YIL SAYACI", fill=(88, 166, 255), anchor="mm", font_size=70)
              draw.text((960, 560), text_timer, fill=(255, 255, 255), anchor="mm", font_size=90)

              proc.stdin.write(img.tobytes())
              time.sleep(1)
          EOF

          python3 generate_stream.py






