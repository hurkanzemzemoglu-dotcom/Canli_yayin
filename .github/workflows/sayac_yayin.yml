name: "24/7 Live 2027 Countdown"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser python3

      - name: Prepare Audio & Start Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Web sunucusunu başlat
          python3 -m http.server 8000 &
          sleep 2

          # 2. Sanal ekranı başlat
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # 3. Sayaç sayfasını aç
          chromium-browser --no-sandbox --disable-setuid-sandbox --kiosk --start-maximized "http://localhost:8000/sayac.html" &
          sleep 5

          # 4. MP3 dosyalarını bul ve hepsini tek bir birleşik yayına hazır ses dosyasına çevir
          # (Bu adım dosya ismi büyük/küçük harf olsa bile hepsini otomatik yakalar)
          echo "Müzik dosyaları hazırlanıyor..."
          ffmpeg -i $(ls muzik1* | head -n 1) -i $(ls muzik2* | head -n 1) -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[outa]" -map "[outa]" -c:a aac -b:a 128k -ar 44100 birlesik_ses.aac -y

          # 5. Yayını YouTube'a Gönder (Görüntü: Sayaç, Ses: Hazırlanan Müzik)
          ffmpeg -f x11grab -video_size 1920x1080 -framerate 30 -i :99.0 \
          -stream_loop -1 -i birlesik_ses.aac \
          -map 0:v:0 -map 1:a:0 \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -g 60 \
          -c:a copy \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"




  










      
      



      
      
          
          


