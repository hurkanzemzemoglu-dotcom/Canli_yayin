name: "24/7 Live 2027 Countdown"

on:
  workflow_dispatch:
  schedule:
    # Her 5 saatte bir otomatik olarak yeniler
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser python3

      - name: Start Local Web Server & Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Dahili Python web sunucusunu başlat
          python3 -m http.server 8000 &
          sleep 2

          # 2. Sanal Ekranı Başlat
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # 3. Chromium'u Aç (Sayaç Ekranı)
          chromium-browser --no-sandbox --disable-setuid-sandbox --kiosk --start-maximized "http://localhost:8000/sayac.html" &
          sleep 5

          # 4. İki MP3 dosyasını birleştirip liste oluştur
          printf "file 'muzik1.mp3'\nfile 'muzik2.mp3'\n" > playlist.txt

          # 5. Yayını YouTube'a Gönder (Görüntü: Sayaç, Ses: 2 Müzik Sırayla/Döngüde)
          ffmpeg -f x11grab -video_size 1920x1080 -framerate 30 -i :99.0 \
          -f concat -safe 0 -stream_loop -1 -i playlist.txt \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"



