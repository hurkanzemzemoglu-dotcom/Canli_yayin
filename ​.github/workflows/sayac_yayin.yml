name: "24/7 Live 2027 Countdown"

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg xvfb chromium-browser

      - name: Start Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 3
          HTML_PATH="$(pwd)/sayac.html"
          chromium-browser --no-sandbox --disable-setuid-sandbox --kiosk --start-maximized "file://$HTML_PATH" &
          sleep 5
          RTMP="rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
          ffmpeg -f x11grab -video_size 1920x1080 -framerate 30 -i :99.0 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "$RTMP"










