<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Chrome Dino Stream Live 24/7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Üst Bilgi Barı (Overlay) */
        .top-bar {
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(18,18,18,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            z-index: 10;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 28px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .stat-label { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; font-weight: 600; }
        .stat-value { font-size: 32px; font-weight: 800; }

        .timer-val { color: #ff5252; font-family: monospace; }
        .sub-val { color: #00e676; }
        .goal-val { color: #ffab40; }

        /* Oyun Sahnesi (Tam Ekran Hizalama) */
        .game-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            position: relative;
            width: 1400px;
            height: 350px;
            border-bottom: 4px solid #fff;
            overflow: hidden;
        }

        /* Skor Paneli */
        .score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 36px;
            font-weight: bold;
            font-family: monospace;
            color: #888;
            letter-spacing: 4px;
        }

        /* Pure CSS Dinozor */
        .dino {
            position: absolute;
            bottom: 0;
            left: 120px;
            width: 55px;
            height: 58px;
            background-color: #00e676;
            clip-path: polygon(
                35% 0%, 100% 0%, 100% 35%, 80% 35%, 80% 50%, 100% 50%, 100% 65%, 60% 65%, 60% 80%, 40% 80%, 40% 100%, 20% 100%, 20% 80%, 0% 80%, 0% 40%, 20% 40%, 20% 20%, 35% 20%
            );
            filter: drop-shadow(0 0 10px #00e676);
        }

        .dino.jump {
            animation: jump-anim 0.48s cubic-bezier(0.15, 0.8, 0.25, 1);
        }

        @keyframes jump-anim {
            0% { bottom: 0; }
            50% { bottom: 160px; }
            100% { bottom: 0; }
        }

        /* Kaktüs Engeli */
        .cactus {
            position: absolute;
            bottom: 0;
            right: -40px;
            width: 30px;
            height: 65px;
            background-color: #ff5252;
            border-radius: 6px 6px 0 0;
            filter: drop-shadow(0 0 8px #ff5252);
        }

        .cactus::before, .cactus::after {
            content: '';
            position: absolute;
            background-color: #ff5252;
        }
        .cactus::before { width: 12px; height: 26px; left: -12px; top: 18px; border-radius: 4px 0 0 4px; }
        .cactus::after { width: 12px; height: 32px; right: -12px; top: 12px; border-radius: 0 4px 4px 0; }

        /* Arka Plan Bulutları */
        .cloud {
            position: absolute;
            top: 40px;
            right: -100px;
            width: 80px;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            animation: cloud-move 10s linear infinite;
        }

        @keyframes cloud-move {
            0% { right: -100px; }
            100% { right: 1500px; }
        }

        /* Alt Yayın Barı */
        .bottom-bar {
            width: 100%;
            height: 70px;
            background: #0a0a0a;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }

        .live-badge {
            background: #ff0000;
            padding: 4px 12px;
            border-radius: 6px;
            margin-right: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="stat-card">
            <div class="stat-label">LIVE SUB COUNT</div>
            <div class="stat-value sub-val">201</div>
        </div>
        <div class="stat-card" style="text-align: center;">
            <div class="stat-label">PLAYING FOR</div>
            <div class="stat-value timer-val" id="timer">00 : 00 : 00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SUBSCRIBER GOAL</div>
            <div class="stat-value goal-val">250</div>
        </div>
    </div>

    <div class="game-wrapper">
        <div class="game-container">
            <div class="score-display" id="score">0000000000000000</div>
            <div class="cloud" style="top: 30px; animation-duration: 12s;"></div>
            <div class="cloud" style="top: 80px; animation-duration: 16s; animation-delay: 4s;"></div>
            <div class="dino" id="dino"></div>
            <div class="cactus" id="cactus"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <span class="live-badge">🔴 LIVE</span> CHROME DINO GAME FOR 500 DAYS | UNLIMITED RUN 24/7
    </div>

    <script>
        const dino = document.getElementById('dino');
        const cactus = document.getElementById('cactus');
        const scoreDisplay = document.getElementById('score');
        
        let score = 0;
        let cactusSpeed = 7;
        let cactusPos = 1400;

        function gameLoop() {
            cactusPos -= cactusSpeed;
            if (cactusPos < -40) {
                cactusPos = 1400 + Math.random() * 300;
            }
            cactus.style.left = cactusPos + 'px';

            // Otomatik Zıplama Hassasiyeti
            if (cactusPos > 120 && cactusPos < 210) {
                if (!dino.classList.contains('jump')) {
                    dino.classList.add('jump');
                    setTimeout(() => {
                        dino.classList.remove('jump');
                    }, 480);
                }
            }

            score += 1;
            scoreDisplay.innerText = score.toString().padStart(16, '0');

            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        let totalSeconds = 0;
        setInterval(() => {
            totalSeconds++;
            let hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            let mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let secs = (totalSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${hrs} : ${mins} : ${secs}`;
        }, 1000);
    </script>
</body>
</html>
