<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Chrome Dino Stream - Full Auto Multi-Cactus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f7f7f7;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border-bottom: 2px solid #e0e0e0;
        }

        .stats-box {
            background: #222;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        .timer-box { text-align: center; color: #333; }
        .timer-title { font-size: 14px; color: #666; font-weight: bold; }
        .timer-value { font-size: 28px; font-weight: bold; color: #d63031; }

        .game-container {
            position: relative;
            width: 1000px;
            height: 280px;
            margin-top: 60px;
            border-bottom: 4px solid #535353;
            overflow: hidden;
        }

        .score-display {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #535353;
            letter-spacing: 2px;
        }

        /* Dinozor Ayakta */
        .dino {
            position: absolute;
            bottom: 0;
            left: 80px;
            width: 48px;
            height: 52px;
            background-color: #535353;
            transition: height 0.1s, width 0.1s;
            clip-path: polygon(
                35% 0%, 100% 0%, 100% 35%, 80% 35%, 80% 50%, 100% 50%, 100% 65%, 60% 65%, 60% 80%, 40% 80%, 40% 100%, 20% 100%, 20% 80%, 0% 80%, 0% 40%, 20% 40%, 20% 20%, 35% 20%
            );
            z-index: 10;
        }

        /* Dinozor Zıplama */
        .dino.jump {
            animation: jump-anim 0.65s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        @keyframes jump-anim {
            0% { bottom: 0; }
            50% { bottom: 135px; }
            100% { bottom: 0; }
        }

        /* Dinozor Eğilme */
        .dino.duck {
            height: 30px;
            width: 60px;
            clip-path: polygon(
                0% 40%, 60% 40%, 60% 0%, 100% 0%, 100% 60%, 80% 60%, 80% 100%, 0% 100%
            );
        }

        /* Kaktüs Kapsayıcısı */
        .cactus-group {
            position: absolute;
            bottom: 0;
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        /* Tekil Büyük Kaktüs */
        .single-cactus {
            width: 30px;
            height: 62px;
            background-color: #535353;
            border-radius: 6px 6px 0 0;
            position: relative;
        }
        .single-cactus::before, .single-cactus::after {
            content: '';
            position: absolute;
            background-color: #535353;
        }
        .single-cactus::before { width: 10px; height: 24px; left: -8px; top: 16px; border-radius: 4px 0 0 4px; }
        .single-cactus::after { width: 10px; height: 28px; right: -8px; top: 12px; border-radius: 0 4px 4px 0; }

        /* Kuş Engeli (Pterodactyl) */
        .obstacle-bird {
            position: absolute;
            width: 46px;
            height: 28px;
            background-color: #535353;
            clip-path: polygon(0% 50%, 30% 0%, 70% 30%, 100% 10%, 80% 80%, 40% 60%, 10% 100%);
            animation: flap 0.3s infinite alternate;
        }

        @keyframes flap {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(-0.8); }
        }

        .cloud {
            position: absolute;
            top: 30px;
            right: -60px;
            width: 60px;
            height: 16px;
            background: #c4c4c4;
            border-radius: 10px;
            opacity: 0.7;
            animation: cloud-move 8s linear infinite;
        }

        @keyframes cloud-move {
            0% { right: -60px; }
            100% { right: 1050px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="stats-box">
            LIVE SUB COUNT: <span id="subs" style="color: #55efc4;">201</span>
        </div>
        <div class="timer-box">
            <div class="timer-title">PLAYING FOR</div>
            <div class="timer-value" id="timer">00 : 00 : 00</div>
        </div>
        <div class="stats-box">
            GOAL: <span style="color: #ffeaa7;">250</span>
        </div>
    </div>

    <div class="game-container">
        <div class="score-display" id="score">0000000000000000</div>
        <div class="cloud" style="top: 20px; animation-duration: 10s;"></div>
        <div class="cloud" style="top: 50px; animation-duration: 14s; animation-delay: 3s;"></div>
        <div class="dino" id="dino"></div>
        <div id="obstacle"></div>
    </div>

    <script>
        const dino = document.getElementById('dino');
        const obstacle = document.getElementById('obstacle');
        const scoreDisplay = document.getElementById('score');
        
        let score = 0;
        let speed = 7;
        let obsPos = 1000;
        let obsType = 'cactus'; // 'cactus', 'bird-high', 'bird-low'

        function spawnObstacle() {
            obsPos = 1000;
            const rand = Math.random();
            obstacle.className = '';
            obstacle.innerHTML = '';
            
            if (rand < 0.6) {
                // KAKTÜS GRUBU (1 ile 6 Arasında Rastgele Sayıda Büyük Kaktüs)
                obsType = 'cactus';
                obstacle.className = 'cactus-group';
                obstacle.style.bottom = '0px';
                
                const cactusCount = Math.floor(Math.random() * 6) + 1; // Maksimum 6 tane
                for (let i = 0; i < cactusCount; i++) {
                    const cactusEl = document.createElement('div');
                    cactusEl.className = 'single-cactus';
                    obstacle.appendChild(cactusEl);
                }
            } else if (rand < 0.85) {
                // ALÇAK KUŞ (Eğilme gerekir)
                obsType = 'bird-low';
                obstacle.className = 'obstacle-bird';
                obstacle.style.bottom = '40px';
            } else {
                // YÜKSEK KUŞ (Altından geçilir)
                obsType = 'bird-high';
                obstacle.className = 'obstacle-bird';
                obstacle.style.bottom = '95px';
            }
        }

        function gameLoop() {
            obsPos -= speed;
            if (obsPos < -250) {
                spawnObstacle();
            }
            obstacle.style.left = obsPos + 'px';

            // GELİŞMİŞ AI ZAMANLAMA KONTROLÜ
            if (obsPos > 90 && obsPos < 220) {
                if (obsType === 'cactus') {
                    if (!dino.classList.contains('jump')) {
                        dino.classList.add('jump');
                        setTimeout(() => dino.classList.remove('jump'), 650);
                    }
                } else if (obsType === 'bird-low') {
                    if (!dino.classList.contains('duck')) {
                        dino.classList.add('duck');
                        setTimeout(() => dino.classList.remove('duck'), 600);
                    }
                }
            }

            score += 1;
            scoreDisplay.innerText = score.toString().padStart(16, '0');

            requestAnimationFrame(gameLoop);
        }

        spawnObstacle();
        gameLoop();

        // CANLI YAYIN SAYAC LOGIGI
        let totalSeconds = 0;
        setInterval(() => {
            totalSeconds++;
            let hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            let mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let secs = (totalSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${hrs} : ${mins} : ${secs}`;
        }, 1000);
    </script>
</body>
</html>
