<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>2027 Countdown</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; color: #58a6ff; }
        #timer { font-size: 5rem; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>
    <h1>2027 YENİ YIL SAYACI</h1>
    <div id="timer">Yükleniyor...</div>

    <script>
        const targetDate = new Date("January 1, 2027 00:00:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = 
                days + "g " + hours + "s " + minutes + "d " + seconds + "st ";
        }, 1000);
    </script>
</body>
</html>
