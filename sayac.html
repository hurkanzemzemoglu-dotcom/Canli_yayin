<script>
  // Standart ISO Formatı (1 Ocak 2027 00:00:00)
  const targetDate = new Date("2027-01-01T00:00:00").getTime();

  const timerInterval = setInterval(function() {
    const now = new Date().getTime();
    const difference = targetDate - now;

    // Süre dolduysa sayacı durdur
    if (difference <= 0) {
      clearInterval(timerInterval);
      document.getElementById("timer").innerHTML = "MUTLU YILLAR!";
      return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    document.getElementById("timer").innerHTML = 
      days + " d " + hours + " s " + minutes + " d " + seconds + " sn ";
  }, 1000);
</script>
