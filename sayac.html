<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 { font-size: 4rem; margin-bottom: 20px; color: #58a6ff; }
    #timer { font-size: 6rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>2027 YENİ YIL SAYACI</h1>
  <div id="timer">Yükleniyor...</div>

  <script>
    const targetDate = new Date("2027-01-01T00:00:00").getTime();
    function updateTimer() {
      const now = new Date().getTime();
      const difference = targetDate - now;
      if (difference <= 0) {
        document.getElementById("timer").innerHTML = "MUTLU YILLAR!";
        return;
      }
      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);
      document.getElementById("timer").innerHTML = days + "gün " + hours + "saat " + minutes + "dk " + seconds + "sn";
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
