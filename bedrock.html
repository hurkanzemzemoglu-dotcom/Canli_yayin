<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Bedrock Mining Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(to bottom, #7EC0EE 0%, #7EC0EE 60%, #5c9428 60%, #5c9428 65%, #3d2817 65%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Üst Bilgi Yazısı */
        .header-box {
            position: absolute;
            top: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #fff;
            padding: 15px 30px;
            color: #fff;
            text-align: center;
            box-shadow: 5px 5px 0px #000;
        }
        .header-box h1 { font-size: 32px; color: #ffcc00; text-shadow: 2px 2px #000; }
        .header-box p { font-size: 20px; margin-top: 5px; color: #fff; }

        /* Bedrock Blok ve Kazma Sahnesi */
        .scene {
            position: relative;
            width: 250px;
            height: 250px;
            margin-top: 80px;
        }

        /* Katman Kayası (Bedrock) */
        .bedrock-block {
            width: 100%;
            height: 100%;
            background-color: #333;
            background-image: 
                radial-gradient(#111 15%, transparent 16%),
                radial-gradient(#222 15%, transparent 16%),
                radial-gradient(#555 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px, 7px 22px;
            border: 6px solid #111;
            box-shadow: inset 0 0 20px #000, 10px 10px 0px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        /* Kazma (Pickaxe) Animasyonu */
        .pickaxe {
            position: absolute;
            top: -60px;
            right: -60px;
            width: 120px;
            height: 120px;
            transform-origin: bottom left;
            animation: mine 0.4s infinite alternate ease-in-out;
        }

        /* Kodla Çizilen Kazma Görünümü */
        .pickaxe-head {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 70px;
            height: 20px;
            background: #8b5a2b;
            border: 3px solid #000;
            border-radius: 50% 50% 0 0;
            transform: rotate(-45deg);
            background: linear-gradient(90deg, #555, #aaa, #555);
        }
        .pickaxe-handle {
            position: absolute;
            top: 25px;
            right: 45px;
            width: 12px;
            height: 90px;
            background: #8b5a2b;
            border: 2px solid #000;
            transform: rotate(-45deg);
        }

        /* Vurma Haraketi */
        @keyframes mine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-45deg); }
        }

        /* Kırılma Efekti Parçacıkları */
        .spark {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            background: #fff;
            animation: spark-anim 0.4s infinite linear;
        }
        @keyframes spark-anim {
            0% { opacity: 1; transform: scale(1) translate(0, 0); }
            100% { opacity: 0; transform: scale(2) translate(30px, -30px); }
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>MINECRAFT BEDROCK MINING</h1>
        <p>Can Break the Bedrock? / Katman Kayası Kırılır mı?</p>
    </div>

    <div class="scene">
        <div class="bedrock-block"></div>
        <div class="spark"></div>
        <div class="pickaxe">
            <div class="pickaxe-head"></div>
            <div class="pickaxe-handle"></div>
        </div>
    </div>

</body>
</html>
