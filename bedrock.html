<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Breaking Bedrock Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(to bottom, #7EC0EE 0%, #7EC0EE 55%, #2e6f10 55%, #22520c 60%, #3d2817 60%);
            position: relative;
        }

        .top-right-counter {
            position: absolute;
            top: 25px;
            right: 30px;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #fff;
            padding: 10px 25px;
            text-align: center;
            color: #fff;
            box-shadow: 5px 5px 0px #000;
        }
        .top-right-counter .title { font-size: 16px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .top-right-counter .timer { font-size: 36px; font-weight: bold; color: #fff; letter-spacing: 2px; }
        .top-right-counter .timer span { color: #ff3333; }

        .like-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            text-shadow: 3px 3px 0px #000;
        }
        .like-icon { font-size: 35px; color: #55ff55; }
        .like-count { font-size: 40px; font-weight: bold; margin-top: -5px; }

        .sub-container {
            position: absolute;
            bottom: 40px;
            left: 30px;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #55ff55;
            padding: 12px 25px;
            color: #fff;
            box-shadow: 5px 5px 0px #000;
        }
        .sub-title { font-size: 16px; color: #55ff55; font-weight: bold; letter-spacing: 1px; }
        .sub-count { font-size: 48px; font-weight: bold; text-shadow: 3px 3px 0px #000; color: #fff; }
        .sub-goal { font-size: 16px; color: #ffcc00; text-align: right; font-weight: bold; }

        .game-scene {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
        }

        .bedrock-block {
            width: 220px;
            height: 220px;
            position: absolute;
            bottom: 0;
            left: 20px;
            background-color: #222;
            background-image: 
                radial-gradient(#000 20%, transparent 20%),
                radial-gradient(#444 20%, transparent 20%),
                radial-gradient(#111 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px, 5px 15px;
            border: 6px solid #000;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.8), 8px 8px 0px rgba(0,0,0,0.5);
        }

        .pickaxe {
            position: absolute;
            top: -40px;
            right: -30px;
            width: 120px;
            height: 120px;
            transform-origin: bottom left;
            animation: mine-anim 0.35s infinite alternate ease-in-out;
            filter: drop-shadow(4px 4px 0px #000);
        }

        .pickaxe-head {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 80px;
            height: 22px;
            background: linear-gradient(90deg, #2b2b2b, #4a4a5a, #2b2b2b);
            border: 3px solid #000;
            border-radius: 40% 40% 0 0;
            transform: rotate(-45deg);
        }

        .pickaxe-handle {
            position: absolute;
            top: 25px;
            right: 48px;
            width: 14px;
            height: 100px;
            background: #5c4033;
            border: 3px solid #000;
            transform: rotate(-45deg);
        }

        @keyframes mine-anim {
            0% { transform: rotate(15deg) translate(0, 0); }
            100% { transform: rotate(-35deg) translate(-25px, 25px); }
        }
    </style>
</head>
<body>

    <div class="like-container">
        <div class="like-icon">👍</div>
        <div class="like-count" id="likeCount">12</div>
    </div>

    <div class="top-right-counter">
        <div class="title">MINING FOR:</div>
        <div class="timer" id="timer">0000 : 01 : 12 : <span id="sec">00</span></div>
    </div>

    <div class="sub-container">
        <div class="sub-title">LIVE SUB COUNT</div>
        <div class="sub-count" id="subCount">201</div>
        <div class="sub-goal">HEDEF: 250</div>
    </div>

    <div class="game-scene">
        <div class="bedrock-block"></div>
        <div class="pickaxe">
            <div class="pickaxe-head"></div>
            <div class="pickaxe-handle"></div>
        </div>
    </div>

    <script>
        let seconds = 0;
        let likes = 12;
        let subs = 201;

        setInterval(() => {
            seconds++;
            if(seconds < 10) {
                document.getElementById('sec').innerText = '0' + seconds;
            } else if(seconds < 60) {
                document.getElementById('sec').innerText = seconds;
            } else {
                seconds = 0;
                document.getElementById('sec').innerText = '00';
            }

            if(Math.random() > 0.85) {
                likes += 1;
                document.getElementById('likeCount').innerText = likes;
            }
            if(Math.random() > 0.95) {
                subs += 1;
                document.getElementById('subCount').innerText = subs;
            }
        }, 1000);
    </script>
</body>
</html>
