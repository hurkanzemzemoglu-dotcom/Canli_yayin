<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Breaking Bedrock Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Minecraft', 'Courier New', monospace;
            /* Minecraft Jungle Arka Planı */
            background: url('https://images.alphacoders.com/131/1314358.jpeg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Karartma Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15);
        }

        /* Sağ Üst: Mining For Sayacı */
        .top-right-counter {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(0, 0, 0, 0.75);
            border: 3px solid #fff;
            padding: 10px 25px;
            text-align: center;
            color: #fff;
            border-radius: 4px;
            box-shadow: 4px 4px 0px #000;
        }
        .top-right-counter .title { font-size: 16px; color: #aaa; text-transform: uppercase; }
        .top-right-counter .timer { font-size: 38px; font-weight: bold; color: #fff; letter-spacing: 2px; }
        .top-right-counter .timer span { color: #ff3333; }

        /* Üst Orta: Beğeni Sayısı (Like Count) */
        .like-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            text-shadow: 3px 3px 0px #000;
        }
        .like-icon { font-size: 35px; color: #55ff55; filter: drop-shadow(2px 2px 0px #000); }
        .like-count { font-size: 42px; font-weight: bold; margin-top: -5px; }

        /* Sol Alt: Live Sub Count */
        .sub-container {
            position: absolute;
            bottom: 40px;
            left: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #000;
            padding: 12px 20px;
            color: #fff;
            box-shadow: 4px 4px 0px #000;
        }
        .sub-title { font-size: 16px; color: #55ff55; font-weight: bold; letter-spacing: 1px; }
        .sub-count { font-size: 45px; font-weight: bold; text-shadow: 3px 3px 0px #000; }
        .sub-goal { font-size: 16px; color: #aaa; text-align: right; }

        /* Sahne: Bedrock ve Kazma */
        .game-scene {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
        }

        /* Gerçek Bedrock Dokusu */
        .bedrock-block {
            width: 220px;
            height: 220px;
            position: absolute;
            bottom: 0;
            left: 40px;
            background: url('https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/03/Bedrock_JE2_BE2.png') repeat;
            background-size: 100px 100px;
            border: 4px solid #000;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.7), 8px 8px 0px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }

        /* Netherite Kazma Görseli ve Vurma Animasyonu */
        .pickaxe {
            position: absolute;
            top: -20px;
            right: -30px;
            width: 160px;
            height: 160px;
            background: url('https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/2f/Netherite_Pickaxe_JE3_BE2.png') no-repeat center;
            background-size: contain;
            image-rendering: pixelated;
            transform-origin: bottom left;
            animation: mine-animation 0.35s infinite alternate ease-in-out;
            filter: drop-shadow(5px 5px 0px #000);
        }

        @keyframes mine-animation {
            0% { transform: rotate(15deg) translate(0, 0); }
            100% { transform: rotate(-35deg) translate(-20px, 20px); }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- Üst Orta: Beğeni Sayısı -->
    <div class="like-container">
        <div class="like-icon">👍</div>
        <div class="like-count" id="likeCount">659,982</div>
    </div>

    <!-- Sağ Üst: Mining Timer -->
    <div class="top-right-counter">
        <div class="title">MINING FOR:</div>
        <div class="timer" id="timer">1084 : 16 : 04 : <span id="sec">07</span></div>
    </div>

    <!-- Sol Alt: Live Sub Count -->
    <div class="sub-container">
        <div class="sub-title">LIVE SUB COUNT</div>
        <div class="sub-count" id="subCount">658,204</div>
        <div class="sub-goal">660,000?</div>
    </div>

    <!-- Oyun Alanı -->
    <div class="game-scene">
        <div class="bedrock-block"></div>
        <div class="pickaxe"></div>
    </div>

    <script>
        // Sürekli Artan Canlı Sayac Saniyesi
        let seconds = 7;
        let likes = 659982;
        let subs = 658204;

        setInterval(() => {
            seconds++;
            if(seconds < 10) {
                document.getElementById('sec').innerText = '0' + seconds;
            } else if(seconds < 60) {
                document.getElementById('sec').innerText = seconds;
            } else {
                seconds = 0;
                document.getElementById('sec').innerText = '00';
            }

            // Arada sırada beğeni ve abone artırma efekti
            if(Math.random() > 0.6) {
                likes += Math.floor(Math.random() * 3) + 1;
                document.getElementById('likeCount').innerText = likes.toLocaleString();
            }
            if(Math.random() > 0.8) {
                subs += 1;
                document.getElementById('subCount').innerText = subs.toLocaleString();
            }
        }, 1000);
    </script>
</body>
</html>
